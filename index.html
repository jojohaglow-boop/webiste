<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>EZ Victories</title>
    <style>
        body { font-family: sans-serif; background: #1a1a1a; color: white; }
        .record { background: #333; margin: 10px; padding: 15px; border-radius: 8px; }
    </style>
</head>
<body>

    <h1>Tuff Best lvls</h1>
    <div id="list-container">Lade Daten...</div>

    <script>
        // Füge hier deinen kopierten CSV-Link ein
        const sheetUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRmXrueZxTHEJB2VVYz36G7dNiWJPhL8SscQ5sKd6CGuvwTPX6ArSyXFdJ2hNP8xPXuixx-YHOOqG0A/pub?output=csv';

        fetch(sheetUrl)
            .then(response => response.text())
            .then(csv => {
                const container = document.getElementById('list-container');
                container.innerHTML = ''; // "Lade Daten..." entfernen
                
                // CSV in Zeilen aufteilen (die erste Zeile sind die Überschriften)
                const rows = csv.split('\n').slice(1); 

                rows.reverse();
                
                rows.forEach(row => {
                    // Spalten aufteilen (Zeitstempel, Name, Level, Prozent, Beweis)
                    // Wichtig: Geht davon aus, dass niemand Kommas in die Textfelder tippt!
                    const columns = row.split(','); 
                    if(columns.length >= 3) {
                        const level = columns[1];
                        const percent = columns[2];
                        const nickname = columns[3];

                        // HTML für jeden Eintrag bauen
                        container.innerHTML += `
                            <div class="record">
                                <h3>${level} (${percent}%)</h3>
                                <p>Geschafft von: ${nickname}</p>
                            </div>
                        `;
                    }
                });
            });
    </script>

</body>
</html>
